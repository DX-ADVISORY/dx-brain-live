x.font='11px ui-monospace,Consolas';const g=gate();SRC.forEach((s,i)=>{const p=src(i);x.strokeStyle='#1d3350';x.beginPath();x.moveTo(p[0]+40,p[1]);x.quadraticCurveTo(g[0]-40,p[1],g[0],g[1]);x.stroke();box2(p[0]-30,p[1]-11,92,22,'#38d9f5',s)});
box2(g[0]-52,g[1]-34,104,68,'#f5b942','CỔNG LỌC');x.fillStyle='#7d8ba1';x.font='9px ui-monospace';['bí mật/bệnh nhân','phân khách hàng','gộp trùng'].forEach((t,k)=>x.fillText(t,g[0]-46,g[1]+0+k*11));
// particles
if(!reduced&&Math.random()<.35)emit();P=P.filter(p=>{p.t+=p.v*dt/16;let q;if(p.ph==0){const a=[src(p.s)[0]+40,src(p.s)[1]];q=bez(a,[g[0]-40,a[1]],g,p.t);if(p.t>=1){p.ph=1;p.t=0}}else if(p.ph==1){const d=toXY(pos[p.d]);q=bez([g[0]+52,g[1]],[(g[0]+d[0])/2,g[1]-60],d,p.t);if(p.t>=1){p.ph=2;p.t=0}}else{const d=toXY(pos[p.d]);q=bez(d,[(d[0]+hub[0])/2,(d[1]+hub[1])/2-30],hub,p.t);if(p.t>=1){if(Math.random()<.5)spawn(1);born++;return false}}
const col=p.ph==0?'#38d9f5':p.ph==1?'#f5b942':R[p.d].color;x.fillStyle=col;x.shadowColor=col;x.shadowBlur=10;x.beginPath();x.arc(q[0],q[1],2.2,0,7);x.fill();x.shadowBlur=0;return true});
// region nodes
pos.forEach((p,j)=>{const q=toXY(p),rr=j==9?0:13,c=R[j].color;if(j==9)return;x.fillStyle=hexA(c,.15);x.beginPath();x.arc(q[0],q[1],rr+6+(reduced?0:2*Math.sin(tt*3+j)),0,7);x.fill();x.fillStyle=c;x.beginPath();x.arc(q[0],q[1],rr,0,7);x.fill();x.fillStyle='#000';x.font='bold 11px ui-monospace';x.textAlign='center';x.fillText(String(j+1).padStart(2,'0'),q[0],q[1]+4);x.fillStyle='#c8d4e4';x.font='11px ui-monospace';x.fillText(R[j].name,q[0],q[1]+28);x.fillStyle=R[j].status=='pass'?'#3ee08f':'#f5b942';x.beginPath();x.arc(q[0]+11,q[1]-11,3.5,0,7);x.fill();x.textAlign='left'});
// hub
const pul=reduced?1:1+.12*Math.sin(tt*2.4);const gr=x.createRadialGradient(hub[0],hub[1],0,hub[0],hub[1],70*pul);gr.addColorStop(0,'#ffffffee');gr.addColorStop(.25,'#7ae7ffaa');gr.addColorStop(1,'#38d9f500');x.fillStyle=gr;x.beginPath();x.arc(hub[0],hub[1],70*pul,0,7);x.fill();
for(let k=0;k<3;k++){const ph=reduced?.5:((tt*.6+k/3)%1);x.strokeStyle=hexA('#38d9f5',.5*(1-ph));x.beginPath();x.arc(hub[0],hub[1],24+ph*90,0,7);x.stroke()}
x.fillStyle='#04121c';x.font='bold 12px ui-monospace';x.textAlign='center';x.fillText('BỘ NÃO',hub[0],hub[1]-2);x.fillText('TRUNG TÂM',hub[0],hub[1]+12);x.textAlign='left';
x.fillStyle='#7d8ba1';x.font='11px ui-monospace';x.fillText(`nơ-ron mô phỏng: ${N.length} · hạt tri thức đã vào: ${born} · brain ${S.brain.status} ${S.brain.sources}`,12,H-12);
requestAnimationFrame(frame)}
function box2(a,b,w,h,c,t){x.fillStyle='#0a1422';x.strokeStyle=c;x.shadowColor=c;x.shadowBlur=8;x.beginPath();x.roundRect(a,b,w,h,6);x.fill();x.stroke();x.shadowBlur=0;x.fillStyle=c;x.font='11px ui-monospace';x.fillText(t,a+7,b+15)}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
cv.onclick=ev=>{const b=cv.getBoundingClientRect(),mx=ev.clientX-b.left,my=ev.clientY-b.top;pos.forEach((p,j)=>{const q=toXY(p);if((q[0]-mx)**2+(q[1]-my)**2<(j==9?40:20)**2)show(j)})};
