name: Cloud heartbeat (not ingestion)

# UTC cron. ICT is UTC+7, so these runs are 07:20, 13:20, 17:20, and 01:20 ICT
# on the following calendar day for the last one. The laptop task
# DX_BrainMap_v6_Refresh stays at 20:00 ICT (13:00 UTC) and is not duplicated.
# The monthly legal scan is also left on the laptop.
on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 6 * * *"
    - cron: "20 10 * * *"
    - cron: "20 18 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dx-cloud-heartbeat-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Syntax-check the status script
        run: node --check cloud-status.js

  heartbeat:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Run contract tests before writing status
        run: python3 -m unittest discover -s tests -t . -v
      - name: Restore the status hook
        run: python3 -m ops.ensure_status_hook --repo .
      - name: Refuse protected dashboard edits
        run: python3 -m ops.verify_public_diff --repo .
      - name: Record the heartbeat and receipt file
        run: python3 -m ops.run_cloud_heartbeat --repo .
      - name: Confirm the snapshot page stayed protected
        run: python3 -m ops.verify_public_diff --repo .
      - name: Commit status without force-push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- status/cloud_contract.json status/ingestion_receipts.json status/heartbeat_log.jsonl index.html
          if git diff --cached --quiet; then
            echo "NO_STATUS_CHANGE"
            exit 0
          fi
          git commit -m "cloud heartbeat (not ingestion)"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          echo "LAPTOP_PUBLISH_CONFLICT: refused to force-push"
          exit 1
